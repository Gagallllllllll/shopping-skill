    <text x="128" y="112" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="92" letter-spacing="1" fill="#0F1A22">shopping</text>
    <text x="132" y="154" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" fill="#3D4F5E">A professional shopping advisor for Claude Code</text>
