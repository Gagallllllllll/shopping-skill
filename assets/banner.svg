      <rect x="132" y="186" width="96" height="36" rx="8" fill="#E3EFF6"/><text x="180" y="210" text-anchor="middle">sport</text>
      <rect x="240" y="186" width="148" height="36" rx="8" fill="#E3EFF6"/><text x="314" y="210" text-anchor="middle">electronics</text>
      <rect x="400" y="186" width="112" height="36" rx="8" fill="#E3EFF6"/><text x="456" y="210" text-anchor="middle">fashion</text>
      <rect x="524" y="186" width="128" height="36" rx="8" fill="#E3EFF6"/><text x="588" y="210" text-anchor="middle">furniture</text>
