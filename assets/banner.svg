<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">shopping</title>
  <desc id="d">A professional shopping advisor for Claude Code: sport, electronics, fashion, furniture. Best delivered price, second-hand, buying sheets.</desc>
  <defs>
